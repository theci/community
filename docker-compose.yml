version: '3.8'

services:
  # Spring Boot API 서버
  community-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: community-platform-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=mySecretKeyForJWTTokenGenerationThatIsLongEnoughForHS512AlgorithmSecurity
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_H2_CONSOLE_ENABLED=true
      - LOGGING_LEVEL_COM_COMMUNITY_PLATFORM=DEBUG
      - SPRING_DATA_REDIS_HOST=test-0001-001.test.mxcsbc.apn2.cache.amazonaws.com
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_SSL_ENABLED=false
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - community-network

  # PostgreSQL 데이터베이스 (프로덕션 환경용 - 선택적)
  postgres:
    image: postgres:15-alpine
    container_name: community-postgres
    environment:
      POSTGRES_DB: community_platform
      POSTGRES_USER: community
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - community-network
    profiles:
      - production

  # Redis (캐싱용 - 선택적)
  redis:
    image: redis:7-alpine
    container_name: community-redis
    ports:
      - "6379:6379"
    environment:
      - SPRING_REDIS_HOST=clustercfg.test.mxcsbc.apn2.cache.amazonaws.com
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_SSL_ENABLED=false
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - community-network
    profiles:
      - production

networks:
  community-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: